<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>SMP — LaTeX Quick Viewer</title>
    <link rel="stylesheet" href="katex/katex.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 440px;
            min-height: 480px;
            background: #111517;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 13px;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 16px;
            background: #161c1f;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge {
            background: rgba(92, 225, 230, 0.15);
            color: #5ce1e6;
            border: 1px solid rgba(92, 225, 230, 0.3);
            font-size: 10px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .title {
            font-size: 13px;
            font-weight: 600;
            color: #f8fafc;
        }
        .body-wrap {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .textarea-box {
            width: 100%;
            height: 95px;
            background: #080b0c;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #e2e8f0;
            font-family: monospace;
            font-size: 12px;
            padding: 10px;
            resize: none;
            outline: none;
            line-height: 1.4;
        }
        .textarea-box:focus {
            border-color: #5ce1e6;
        }
        .action-bar {
            display: flex;
            gap: 8px;
        }
        .btn {
            background: rgba(92, 225, 230, 0.15);
            border: 1px solid rgba(92, 225, 230, 0.4);
            color: #5ce1e6;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            flex: 1;
            text-align: center;
        }
        .btn:hover {
            background: rgba(92, 225, 230, 0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            flex: none;
            padding: 6px 10px;
        }
        .btn-outline:hover {
            color: #f1f5f9;
            border-color: rgba(255, 255, 255, 0.3);
        }
        .preview-header {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
        }
        .preview-box {
            min-height: 140px;
            max-height: 220px;
            overflow-y: auto;
            background: #0d1113;
            border: 1px solid rgba(92, 225, 230, 0.2);
            border-radius: 8px;
            padding: 12px;
            color: #f1f5f9;
            line-height: 1.7;
            font-size: 13px;
        }
        .preview-box .katex {
            color: #67e8f9;
            font-size: 1.15em;
        }
        .footer {
            padding: 10px 14px;
            background: #14181a;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 11px;
            color: #64748b;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .footer a {
            color: #5ce1e6;
            text-decoration: none;
        }
        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title-group">
            <span class="badge">SMP</span>
            <span class="title">LaTeX Quick Viewer</span>
        </div>
        <button class="btn btn-outline" id="btn-sample" title="Dán mẫu bình luận ví dụ">Thử Mẫu</button>
    </div>

    <div class="body-wrap">
        <textarea class="textarea-box" id="input-text" placeholder="Dán bình luận toán học gõ ẩu hoặc công thức thô vào đây..."></textarea>

        <div class="action-bar">
            <button class="btn" id="btn-translate">Biên Dịch KaTeX</button>
            <button class="btn btn-outline" id="btn-copy">Sao Chép TeX</button>
            <button class="btn btn-outline" id="btn-clear">Xóa</button>
        </div>

        <div class="preview-header">
            <span>Kết quả hiển thị:</span>
            <span id="stat-info">0 ký tự</span>
        </div>
        <div class="preview-box" id="preview-box">
            <span style="color: #64748b; font-style: italic;">Nhập hoặc dán văn bản phía trên để xem kết quả biên dịch...</span>
        </div>
    </div>

    <div class="footer">
        <span>Bôi đen chuột phải: <b>SMP — Dịch LaTeX</b></span>
        <a href="https://smp.edu.vn" target="_blank">Web Tool ↗</a>
    </div>

    <script src="katex/katex.min.js"></script>
    <script src="katex/contrib/auto-render.min.js"></script>
    <script src="normalizer.js"></script>
    <script src="popup.js"></script>
</body>
</html>
