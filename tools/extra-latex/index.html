<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMP">
    <link rel="apple-touch-icon" href="/core/image/favicon-192.png">
    <title>SMP — Extra LaTeX: Soạn Thảo &amp; Định Vị Tự Do</title>

    <!-- MathLive for visual equation editing -->
    <script src="https://unpkg.com/mathlive"></script>

    <!-- MathJax for TeX render & Word MathML conversion -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['noerrors', 'noundefined', 'amsmath', 'ams', 'newcommand', 'mathtools', 'physics']}
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- html2canvas for high-res PNG export -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        if(localStorage.getItem('smp-dark-mode')==='true')document.documentElement.classList.add('dark-mode');
        if(localStorage.getItem('smp-sidebar-collapsed')==='true')document.documentElement.classList.add('sidebar-collapsed');
    </script>

    <!-- Shared SMP Styles -->
    <link class="theme-link" rel="stylesheet" href="/core/css/shared.css?v=38">
    <!-- Extra LaTeX Modern Mathcha Styles -->
    <link rel="stylesheet" href="/tools/extra-latex/extra-latex.css?v=6">
    <link rel="icon" type="image/png" href="/core/image/favicon.png">
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>

        <main>
            <div class="main-content-layout">
                <div class="main-articles-body">

                    <!-- Top Navigation Bar -->
                    <div class="top-nav-bar fade-up">
                        <div class="app-title-tag">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 8h10"/><path d="M7 12h4"/><path d="M7 16h10"/></svg>
                            Extra $\LaTeX$ Editor
                        </div>
                    </div>

                    <!-- 1. TOP HORIZONTAL RIBBON TOOLBAR (Mathcha Style) -->
                    <div class="mathcha-top-ribbon fade-up">
                        
                        <!-- Mode Tabs: Bảng Vẽ | A4 | Beamer -->
                        <div class="ribbon-section">
                            <div class="mode-tabs">
                                <button type="button" class="mode-tab-btn" data-mode="canvas" onclick="setCanvasMode('canvas')" title="Bảng vẽ vô hạn">Bảng Vẽ</button>
                                <button type="button" class="mode-tab-btn active" data-mode="a4" onclick="setCanvasMode('a4')" title="Khổ giấy A4 (210 x 297 mm)">Giấy A4</button>
                                <button type="button" class="mode-tab-btn" data-mode="beamer" onclick="setCanvasMode('beamer')" title="Slide thuyết trình Beamer (16:9)">Slide Beamer</button>
                            </div>
                        </div>

                        <div class="ribbon-divider"></div>

                        <!-- Alignment Group -->
                        <div class="ribbon-section">
                            <button type="button" class="rb-btn" onclick="execFormat('justify-left')" title="Căn trái">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="15" y1="12" x2="3" y2="12"/><line x1="17" y1="18" x2="3" y2="18"/></svg>
                            </button>
                            <button type="button" class="rb-btn" onclick="execFormat('justify-center')" title="Căn giữa">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="18" y1="12" x2="6" y2="12"/><line x1="21" y1="18" x2="3" y2="18"/></svg>
                            </button>
                            <button type="button" class="rb-btn" onclick="execFormat('justify-right')" title="Căn phải">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="21" y1="6" x2="3" y2="6"/><line x1="21" y1="12" x2="9" y2="12"/><line x1="21" y1="18" x2="7" y2="18"/></svg>
                            </button>
                        </div>

                        <div class="ribbon-divider"></div>

                        <!-- Font Size Selector -->
                        <div class="ribbon-section">
                            <select class="rb-select" onchange="execFormat('size', this.value)" title="Cỡ chữ">
                                <option value="0.82rem">Nhỏ (small)</option>
                                <option value="0.95rem" selected>Vừa (normalsize)</option>
                                <option value="1.25rem">Lớn (large)</option>
                                <option value="1.6rem">Rất lớn (Huge)</option>
                            </select>
                        </div>

                        <div class="ribbon-divider"></div>

                        <!-- Text Formatting Group: B, I, U, S -->
                        <div class="ribbon-section">
                            <button type="button" class="rb-btn" onclick="execFormat('bold')" title="In đậm (\textbf) [Ctrl+B]"><b>B</b></button>
                            <button type="button" class="rb-btn" onclick="execFormat('italic')" title="In nghiêng (\textit) [Ctrl+I]"><i>I</i></button>
                            <button type="button" class="rb-btn" onclick="execFormat('underline')" title="Gạch chân (\underline) [Ctrl+U]"><u>U</u></button>
                            <button type="button" class="rb-btn" onclick="execFormat('strike')" title="Gạch ngang (\sout)"><s>S</s></button>
                            
                            <!-- Color Picker Tool with color bar -->
                            <div class="color-tool-wrap">
                                <button type="button" class="color-indicator-btn" onclick="execFormat('color', '#5ce1e6')" title="Màu chữ (\textcolor)">
                                    <span style="font-weight:700; font-size:0.85rem;">A</span>
                                    <span class="color-bar" id="active-color-bar"></span>
                                </button>
                                <select class="rb-select" style="padding:0; width:14px; border:none; opacity:0; position:absolute; inset:0; cursor:pointer;" onchange="execFormat('color', this.value)">
                                    <option value="#5ce1e6">Xanh Cyan</option>
                                    <option value="#c9a96e">Vàng Gold</option>
                                    <option value="#ef4444">Đỏ</option>
                                    <option value="#22c55e">Xanh Lá</option>
                                    <option value="#3b82f6">Xanh Dương</option>
                                    <option value="#a855f7">Tím</option>
                                    <option value="#ffffff">Trắng / Mặc định</option>
                                </select>
                            </div>
                        </div>

                        <div class="ribbon-divider"></div>

                        <!-- Grid Selector -->
                        <div class="ribbon-section">
                            <select class="rb-select" onchange="setGridType(this.value)" title="Kiểu lưới nền">
                                <option value="dots">Lưới Chấm</option>
                                <option value="lines">Lưới Kẻ Ô</option>
                                <option value="none">Không Lưới</option>
                            </select>
                        </div>

                        <div class="ribbon-divider"></div>

                        <!-- History (Undo / Redo) -->
                        <div class="ribbon-section">
                            <button type="button" class="rb-btn" onclick="undo()" title="Hoàn tác (Ctrl+Z)">↶</button>
                            <button type="button" class="rb-btn" onclick="redo()" title="Làm lại (Ctrl+Y)">↷</button>
                        </div>

                        <!-- Right CTA: Export Button -->
                        <div class="ribbon-section" style="margin-left: auto;">
                            <button type="button" class="export-cta-btn" onclick="openExportDrawer()" title="Mở bảng xuất mã LaTeX, Word, MathType">
                                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                                Xuất Bản ▾
                            </button>
                        </div>

                    </div>

                    <!-- Page Navigation Strip -->
                    <div class="mathcha-page-strip fade-up">
                        <div class="page-nav-controls">
                            <button type="button" class="page-nav-btn" onclick="prevPage()" title="Trang trước">◀</button>
                            <span class="page-indicator" id="page-indicator-text">1 / 1</span>
                            <button type="button" class="page-nav-btn" onclick="nextPage()" title="Trang tiếp theo">▶</button>
                        </div>
                        <div class="page-tabs-container" id="page-tabs-container">
                            <!-- Injected by JS: [Trang 1] [Trang 2] -->
                        </div>
                        <button type="button" class="page-add-btn" onclick="addNewPage()" title="Bổ sung thêm trang mới">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                            + Thêm Trang Mới
                        </button>
                        <button type="button" class="page-del-btn" id="page-del-btn" onclick="deleteCurrentPage()" title="Xóa trang hiện tại" style="display: none;">
                            ✕ Xóa trang
                        </button>
                    </div>

                    <!-- 2. MAIN WORKSPACE: LEFT FLOATING PALETTE + CENTER DOCUMENT CANVAS -->
                    <div class="mathcha-workspace-layout fade-up">
                        
                        <!-- Left Floating Tool Palette (Mathcha Vertical Strip) -->
                        <div class="mathcha-left-palette">
                            <button type="button" class="palette-btn" onclick="addBlock('text')" data-tip="Thêm Văn Bản">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
                            </button>
                            <button type="button" class="palette-btn" onclick="addBlock('math')" data-tip="Thêm Công Thức (∑)">
                                <span style="font-weight:700; font-size:1.15rem; font-family:'JetBrains Mono', monospace;">∑</span>
                            </button>
                            <button type="button" class="palette-btn" onclick="addBlock('box')" data-tip="Thêm Khung / Hộp Ghi Chú">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="3" rx="2" stroke-dasharray="3 3"/></svg>
                            </button>
                            <div style="height:1px; background:rgba(92,225,230,0.15); margin:2px 0;"></div>
                            <button type="button" class="palette-btn del" onclick="clearCanvas()" data-tip="Xóa Toàn Bộ">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                            </button>
                        </div>

                        <!-- Canvas Viewport (The Document Center Stage) -->
                        <div class="mathcha-canvas-viewport grid-dots" id="canvas-viewport">
                            <div class="artboard mode-a4" id="artboard">
                                <!-- Movable blocks injected by JS -->
                            </div>
                            <button type="button" class="page-bottom-add-btn" onclick="addNewPage()" title="Bổ sung thêm trang mới">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                                Bổ Sung Thêm Trang Mới
                            </button>
                        </div>

                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- 3. SLIDE-UP EXPORT DRAWER (Modern Bottom Sheet) -->
    <div class="export-drawer-overlay" id="export-drawer-overlay" onclick="if(event.target === this) closeExportDrawer();">
        <div class="export-drawer-sheet">
            <div class="drawer-header">
                <div class="drawer-title">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    XUẤT BẢN &amp; BIÊN DỊCH MÃ
                </div>
                <button type="button" class="drawer-close-btn" onclick="closeExportDrawer()" title="Đóng">&times;</button>
            </div>
            <div class="drawer-body">
                <div class="drawer-action-row">
                    <!-- Mode Tabs -->
                    <div class="mode-tabs">
                        <button type="button" class="mode-tab-btn drawer-tab-btn active" data-tab="tikz" onclick="setExportTab('tikz')">TikZ Tọa Độ</button>
                        <button type="button" class="mode-tab-btn drawer-tab-btn" data-tab="flow" onclick="setExportTab('flow')">LaTeX Tài Liệu</button>
                        <button type="button" class="mode-tab-btn drawer-tab-btn" data-tab="math" onclick="setExportTab('math')">Chỉ Công Thức</button>
                    </div>

                    <!-- Action buttons -->
                    <div style="display:flex; gap:6px; flex-wrap:wrap;">
                        <button type="button" class="drawer-action-btn btn-primary" onclick="copyForMathType()" title="Dán vào Word rồi ấn Alt + \">Copy MathType (Alt+\)</button>
                        <button type="button" class="drawer-action-btn" onclick="copyForWord()" title="Dán trực tiếp thành Word Equation">Copy Word</button>
                        <button type="button" class="drawer-action-btn" onclick="copyCanvasAsImage()" title="Xuất ảnh PNG 300 DPI">Copy Ảnh (PNG)</button>
                        <button type="button" class="drawer-action-btn" onclick="copyLatexCode()" title="Copy mã nguồn LaTeX">Copy LaTeX</button>
                        <button type="button" class="drawer-action-btn" onclick="downloadTexFile()" title="Tải file .tex">Tải .tex</button>
                        <button type="button" class="drawer-action-btn" onclick="printCanvas()" title="In ấn">In</button>
                    </div>
                </div>

                <textarea id="latex-output" readonly spellcheck="false" placeholder="Mã LaTeX tương ứng..."></textarea>
            </div>
        </div>
    </div>

    <!-- Floating Bubble Formatting Toolbar (Mathcha Style Selection Popover) -->
    <div class="floating-bubble-toolbar" id="floating-bubble">
        <button type="button" class="bubble-btn" data-format="bold" title="In đậm (\textbf) [Ctrl+B]"><b>B</b></button>
        <button type="button" class="bubble-btn" data-format="italic" title="In nghiêng (\textit) [Ctrl+I]"><i>I</i></button>
        <button type="button" class="bubble-btn" data-format="underline" title="Gạch chân (\underline) [Ctrl+U]"><u>U</u></button>
        <button type="button" class="bubble-btn" data-format="strike" title="Gạch ngang (\sout)"><s>S</s></button>
        <div class="bubble-divider"></div>
        <button type="button" class="bubble-btn" data-format="math-inline" title="Đổi thành công thức nội dòng $...$">$x$</button>
        <button type="button" class="bubble-btn" data-format="math-block" title="Đổi thành công thức khối $$...$$">$$X$$</button>
        <div class="bubble-divider"></div>
        <!-- Color Palette -->
        <div class="bubble-color-picker" title="Đổi màu chữ (\textcolor)">
            <span class="color-dot" style="background:#5ce1e6;" data-color="#5ce1e6" title="Xanh Cyan"></span>
            <span class="color-dot" style="background:#c9a96e;" data-color="#c9a96e" title="Vàng Gold"></span>
            <span class="color-dot" style="background:#ef4444;" data-color="#ef4444" title="Đỏ"></span>
            <span class="color-dot" style="background:#22c55e;" data-color="#22c55e" title="Xanh lá"></span>
            <span class="color-dot" style="background:#3b82f6;" data-color="#3b82f6" title="Xanh dương"></span>
            <span class="color-dot" style="background:#a855f7;" data-color="#a855f7" title="Tím"></span>
        </div>
    </div>

    <!-- LaTeX Autocomplete Suggestion Popup -->
    <div class="latex-suggest-popup" id="latex-suggest-popup"></div>

    <!-- Toast Notification -->
    <div class="el-toast" id="el-toast">✓ Đã copy thành công</div>

    <!-- SMP Shared Scripts -->
    <script src="/core/js/shared.js"></script>
    <script src="/core/js/sidebar-data.js"></script>
    <script src="/core/js/layout.js"></script>
    <!-- Extra LaTeX Main Script -->
    <script src="/tools/extra-latex/extra-latex.js?v=4"></script>
</body>
</html>
