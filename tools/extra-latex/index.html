<!DOCTYPE html>
<html lang="vi">
<head>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMP">
    <link rel="apple-touch-icon" href="/core/image/favicon-192.png">
    <title>SMP — Extra LaTeX: Soạn Thảo & Định Vị Tự Do</title>

    <!-- MathLive for visual equation editing -->
    <script src="https://unpkg.com/mathlive"></script>

    <!-- MathJax for TeX render & Word MathML conversion -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                packages: {'[+]': ['noerrors', 'noundefined', 'amsmath', 'ams', 'newcommand', 'mathtools', 'physics']}
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- html2canvas for high-res PNG export -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

    <script>
        if(localStorage.getItem('smp-dark-mode')==='true')document.documentElement.classList.add('dark-mode');
        if(localStorage.getItem('smp-sidebar-collapsed')==='true')document.documentElement.classList.add('sidebar-collapsed');
    </script>

    <!-- Shared SMP Styles -->
    <link class="theme-link" rel="stylesheet" href="/core/css/shared.css?v=38">
    <!-- Extra LaTeX Custom Styles -->
    <link rel="stylesheet" href="/tools/extra-latex/extra-latex.css?v=3">
    <link rel="icon" type="image/png" href="/core/image/favicon.png">
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>

        <main>
            <div class="main-content-layout">

                <div class="main-articles-body">

                    <a href="javascript:history.back()" class="exam-back-btn fade-up">&#8592; Quay Lại</a>

                    <div class="exam-meta fade-up">
                        <span class="exam-tag"><a href="/pages/toanhoc.html" style="color: inherit; text-decoration: none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">MATH</a> &nbsp;&gt;&nbsp; <a href="/pages/toanhoc.html?filter=tools" style="color: inherit; text-decoration: none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">Công Cụ</a> &nbsp;&gt;&nbsp; Extra $\LaTeX$ Trực Quan</span>
                    </div>

                    <div class="latex-hero fade-up">
                        <h1>
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle;"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 8h10"/><path d="M7 12h4"/><path d="M7 16h10"/></svg>
                            Extra $\LaTeX$ — Soạn Thảo &amp; Định Vị
                        </h1>

                        <!-- Mode Switcher: Bảng Vẽ | Giấy A4 | Slide Beamer -->
                        <div class="mode-switch-group">
                            <button type="button" class="mode-btn active" data-mode="canvas" onclick="setCanvasMode('canvas')" title="Bảng vẽ vô hạn tự do">Bảng Vẽ</button>
                            <button type="button" class="mode-btn" data-mode="a4" onclick="setCanvasMode('a4')" title="Khổ giấy A4 (210 x 297 mm)">Giấy A4</button>
                            <button type="button" class="mode-btn" data-mode="beamer" onclick="setCanvasMode('beamer')" title="Khổ Slide thuyết trình Beamer (16:9)">Slide Beamer</button>
                        </div>
                    </div>

                    <!-- Split View: Canvas on Left, Compiler & Output on Right -->
                    <div class="extra-split-layout fade-up">

                        <!-- Left Pane: Visual Canvas Editor -->
                        <div class="split-pane">
                            <div class="pane-header">
                                <div class="pane-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                                    BẢNG SOẠN THẢO
                                </div>
                                <div class="pane-actions">
                                    <button type="button" class="pane-btn btn-highlight" onclick="addBlock('math')" title="Thêm công thức toán">+ Công Thức</button>
                                    <button type="button" class="pane-btn" onclick="addBlock('text')" title="Thêm khối văn bản">+ Văn Bản</button>
                                    <button type="button" class="pane-btn" onclick="addBlock('box')" title="Thêm khung ghi chú">+ Khung</button>
                                    <select class="pane-select" onchange="setGridType(this.value)" title="Kiểu lưới nền">
                                        <option value="dots">Lưới Chấm</option>
                                        <option value="lines">Lưới Ô</option>
                                        <option value="none">Không Lưới</option>
                                    </select>
                                    <select class="pane-select" onchange="setSnapGrid(this.value)" title="Hít lưới tự động">
                                        <option value="10">Hít: 10px</option>
                                        <option value="20">Hít: 20px</option>
                                        <option value="0">Tắt hít</option>
                                    </select>
                                    <button type="button" class="pane-btn" onclick="undo()" title="Hoàn tác (Ctrl+Z)">↶</button>
                                    <button type="button" class="pane-btn" onclick="redo()" title="Làm lại (Ctrl+Y)">↷</button>
                                    <button type="button" class="pane-btn" onclick="window.open('/tools/latex-ocr/index.html', '_blank')" title="Quét công thức từ ảnh (OCR)">📷 OCR</button>
                                    <button type="button" class="pane-btn" onclick="toggleZenMode()" title="Toàn màn hình">⛶ Zen</button>
                                    <button type="button" class="pane-btn danger" onclick="clearCanvas()" title="Xóa toàn bộ">Xóa</button>
                                </div>
                            </div>

                            <!-- Canvas Viewport -->
                            <div class="canvas-viewport grid-dots" id="canvas-viewport">
                                <div class="artboard mode-canvas" id="artboard">
                                    <div class="sheet-watermark" id="sheet-watermark" style="display:none;"></div>
                                    <!-- Movable blocks injected by JS -->
                                </div>
                            </div>
                        </div>

                        <!-- Right Pane: Realtime Compiler & Code Exporter -->
                        <div class="split-pane">
                            <div class="pane-header">
                                <div class="pane-title">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                                    BIÊN DỊCH &amp; XUẤT BẢN
                                </div>
                                <div class="pane-actions">
                                    <button type="button" class="pane-btn btn-highlight" onclick="copyForMathType()" title="Copy mã để biến thành đối tượng MathType trong Word (Alt + \)">
                                        Copy MathType (Alt+\)
                                    </button>
                                    <button type="button" class="pane-btn" onclick="copyForWord()" title="Copy dán thẳng vào Word thành Equation">Copy Word</button>
                                    <button type="button" class="pane-btn" onclick="copyCanvasAsImage()" title="Chụp ảnh PNG 300 DPI">Copy Ảnh</button>
                                    <button type="button" class="pane-btn" onclick="copyLatexCode()" title="Copy mã nguồn LaTeX">Copy LaTeX</button>
                                    <button type="button" class="pane-btn" onclick="downloadTexFile()" title="Tải file .tex">Tải .tex</button>
                                    <button type="button" class="pane-btn" onclick="printCanvas()" title="In">In</button>
                                </div>
                            </div>

                            <div class="compiler-viewport">
                                <!-- Sub Header with Tabs -->
                                <div class="compiler-sub-header">
                                    <span style="font-family:'JetBrains Mono', monospace; font-size:0.7rem; color:var(--accent-cyan); text-transform:uppercase;">Chế Độ Xuất:</span>
                                    <div class="compiler-tabs">
                                        <button type="button" class="compiler-tab-btn active" data-tab="tikz" onclick="setExportTab('tikz')">TikZ Tọa Độ</button>
                                        <button type="button" class="compiler-tab-btn" data-tab="flow" onclick="setExportTab('flow')">LaTeX Tài Liệu</button>
                                        <button type="button" class="compiler-tab-btn" data-tab="math" onclick="setExportTab('math')">Chỉ Công Thức</button>
                                    </div>
                                </div>

                                <!-- Compiler Body: Realtime Visual Preview on Top, Raw LaTeX Code below -->
                                <div class="compiler-body">
                                    <div class="live-render-box" id="live-render-box">
                                        <span style="opacity:0.4; font-style:italic;">Kết quả biên dịch realtime sẽ hiển thị tại đây...</span>
                                    </div>
                                    <div class="raw-code-box">
                                        <textarea id="latex-output" readonly spellcheck="false" placeholder="Mã LaTeX tương ứng..."></textarea>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Floating Bubble Formatting Toolbar (Mathcha Style Selection Popover) -->
    <div class="floating-bubble-toolbar" id="floating-bubble">
        <button type="button" class="bubble-btn" data-format="bold" title="In đậm (\textbf) [Ctrl+B]"><b>B</b></button>
        <button type="button" class="bubble-btn" data-format="italic" title="In nghiêng (\textit) [Ctrl+I]"><i>I</i></button>
        <button type="button" class="bubble-btn" data-format="underline" title="Gạch chân (\underline) [Ctrl+U]"><u>U</u></button>
        <button type="button" class="bubble-btn" data-format="strike" title="Gạch ngang (\sout)"><s>S</s></button>
        <div class="bubble-divider"></div>
        <button type="button" class="bubble-btn" data-format="math-inline" title="Đổi thành công thức nội dòng $...$">$x$</button>
        <button type="button" class="bubble-btn" data-format="math-block" title="Đổi thành công thức khối $$...$$">$$X$$</button>
        <div class="bubble-divider"></div>
        <!-- Color Palette -->
        <div class="bubble-color-picker" title="Đổi màu chữ (\textcolor)">
            <span class="color-dot" style="background:#5ce1e6;" data-color="#5ce1e6" title="Xanh Cyan"></span>
            <span class="color-dot" style="background:#c9a96e;" data-color="#c9a96e" title="Vàng Gold"></span>
            <span class="color-dot" style="background:#ef4444;" data-color="#ef4444" title="Đỏ"></span>
            <span class="color-dot" style="background:#22c55e;" data-color="#22c55e" title="Xanh lá"></span>
            <span class="color-dot" style="background:#3b82f6;" data-color="#3b82f6" title="Xanh dương"></span>
            <span class="color-dot" style="background:#a855f7;" data-color="#a855f7" title="Tím"></span>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="el-toast" id="el-toast">✓ Đã copy thành công</div>

    <!-- SMP Shared Scripts -->
    <script src="/core/js/shared.js"></script>
    <script src="/core/js/sidebar-data.js"></script>
    <script src="/core/js/layout.js"></script>
    <!-- Extra LaTeX Main Script -->
    <script src="/tools/extra-latex/extra-latex.js?v=3"></script>
</body>
</html>
