<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diễn Đàn Toán Học - SMP</title>
    <meta name="description" content="Diễn đàn thảo luận Toán học của SMP — nơi trao đổi bài toán, hướng dẫn và kiến thức.">
    <!-- MathJax (NO polyfill.io!) -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="/SMP/core/css/shared.css?v=5">
    
    <!-- CodeMirror 5 Core & Theme -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/selection/active-line.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
    <!-- CodeMirror Hint -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    
    <!-- SMP LaTeX Core -->
    <link rel="stylesheet" href="/SMP/tools/latex-v2/latex.css">
    <script src="/SMP/core/js/smp-latex-core.js"></script>

    <style>
        .forum-container { max-width: 1000px; margin: 60px auto; padding: 0 24px; }

        .forum-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 32px; border-bottom: 1px solid var(--border-light); padding-bottom: 20px;
        }
        .forum-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; color: var(--accent-gold); }

        .btn-primary {
            background: var(--accent-cyan); color: #111; padding: 10px 22px;
            border-radius: 6px; font-family: 'JetBrains Mono', monospace;
            font-weight: bold; border: none; cursor: pointer; transition: transform 0.2s, background 0.2s;
            font-size: 0.85rem;
        }
        .btn-primary:hover { transform: translateY(-2px); background: var(--accent-gold); }
        .btn-secondary {
            background: transparent; color: var(--text-muted); padding: 8px 16px;
            border-radius: 6px; font-family: 'JetBrains Mono', monospace;
            border: 1px solid var(--border-light); cursor: pointer; font-size: 0.8rem; transition: all 0.2s;
        }
        .btn-secondary:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }
        .btn-danger { background: none; border: 1px solid transparent; color: #e74c3c; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; transition: all 0.2s; }
        .btn-danger:hover { border-color: #e74c3c; background: rgba(231,76,60,0.1); }

        /* Thread list */
        .thread-list { display: flex; flex-direction: column; gap: 14px; }
        .thread-item {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 8px; padding: 18px 20px; cursor: pointer; transition: border-color 0.2s, transform 0.15s;
        }
        .thread-item:hover { border-color: var(--accent-cyan); transform: translateX(4px); }
        .thread-item-title { font-size: 1.15rem; font-family: 'Playfair Display', serif; color: var(--text-dark); margin-bottom: 8px; }
        .thread-item-meta { display: flex; gap: 16px; font-size: 0.8rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; flex-wrap: wrap; }

        /* Thread detail */
        #thread-detail-view { display: none; }
        .btn-back { background: none; border: none; color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; cursor: pointer; font-size: 0.95rem; margin-bottom: 20px; padding: 0; }
        .btn-back:hover { color: var(--accent-gold); text-decoration: underline; }

        .post-card { background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 8px; padding: 24px; margin-bottom: 20px; }
        .post-card.op { border-left: 3px solid var(--accent-gold); }
        .post-card.reply { border-left: 3px solid var(--accent-cyan); }
        .post-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; border-bottom: 1px dashed var(--border-light); padding-bottom: 10px; flex-wrap: wrap; gap: 8px; }
        .post-author { color: var(--accent-gold); font-weight: bold; font-family: 'JetBrains Mono', monospace; }
        .post-date { color: var(--text-muted); font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; }
        .post-content { line-height: 1.75; color: var(--text-dark); white-space: pre-wrap; word-break: break-word; }
        .post-actions { display: flex; gap: 8px; align-items: center; }
        .edit-badge { font-size: 0.7rem; color: var(--text-muted); font-style: italic; margin-left: 8px; }

        /* History modal */
        .history-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 9999; justify-content: center; align-items: center;
        }
        .history-modal-overlay.show { display: flex; }
        .history-modal {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 10px; padding: 28px; max-width: 640px; width: 90%; max-height: 80vh;
            overflow-y: auto;
        }
        .history-item { padding: 12px 0; border-bottom: 1px dashed var(--border-light); }
        .history-item:last-child { border: none; }

        /* LaTeX Editor */
        .latex-editor-wrap { position: relative; margin-bottom: 16px; }
        .latex-textarea {
            width: 100%; box-sizing: border-box;
            padding: 12px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-light); border-radius: 6px;
            color: var(--text-dark); font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem; resize: vertical; min-height: 140px;
            transition: border-color 0.2s; outline: none;
        }
        body:not(.dark-mode) .latex-textarea { background: rgba(0,0,0,0.02); }
        .latex-textarea:focus { border-color: var(--accent-cyan); }
        .latex-preview-toggle {
            background: none; border: none; cursor: pointer;
            font-size: 0.72rem; font-family: 'JetBrains Mono', monospace;
            color: var(--accent-cyan); padding: 4px 0; margin-top: 6px; display: block;
            opacity: 0.75; transition: opacity 0.2s;
        }
        .latex-preview-toggle:hover { opacity: 1; }
        .latex-preview-box {
            display: none; margin-top: 8px; background: rgba(92,225,230,0.04);
            border: 1px solid rgba(92,225,230,0.15); border-radius: 8px;
            padding: 14px 18px; line-height: 1.85; color: var(--text-dark); min-height: 50px;
        }
        .latex-preview-box.active { display: block; }

        /* Create/edit form panel */
        .forum-form {
            background: var(--card-bg); border: 1px solid var(--border-light);
            border-radius: 8px; padding: 24px; margin-bottom: 28px; display: none;
        }
        .forum-form h3 { font-family: 'Playfair Display', serif; margin-bottom: 18px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 6px; font-size: 0.85rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }
        .form-control {
            width: 100%; box-sizing: border-box; padding: 10px 14px;
            background: rgba(255,255,255,0.03); border: 1px solid var(--border-light);
            border-radius: 6px; color: var(--text-dark); font-family: inherit; outline: none;
        }
        body:not(.dark-mode) .form-control { background: rgba(0,0,0,0.02); }
        .form-control:focus { border-color: var(--accent-cyan); }

        .login-notice {
            text-align: center; padding: 20px; border: 1px dashed var(--border-light);
            border-radius: 6px; color: var(--text-muted); margin-bottom: 16px;
        }
        .login-notice a { color: var(--accent-cyan); font-weight: bold; }
        .form-row-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }

        /* Tags and Mentions */
        .forum-tag { display: inline-block; padding: 3px 8px; background: rgba(92,225,230,0.1); color: var(--accent-cyan); border: 1px solid rgba(92,225,230,0.3); border-radius: 4px; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; margin-right: 6px; margin-top: 6px; }
        .forum-mention { color: var(--accent-gold); font-weight: bold; padding: 0 2px; background: rgba(243, 156, 18, 0.1); border-radius: 3px; }
        
        .nav-filter-bar { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
        .nav-filter-bar::-webkit-scrollbar { display: none; }
        .nav-filter-btn { background: transparent; border: 1px solid transparent; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; padding: 6px 14px; cursor: pointer; border-radius: 6px; white-space: nowrap; transition: all 0.3s; }
        .nav-filter-btn:hover { color: var(--accent-cyan); background: rgba(92,225,230,0.1); }
        .nav-filter-btn.active { color: var(--accent-cyan); background: rgba(92,225,230,0.1); border: 1px solid var(--accent-cyan); font-weight: bold; }
        
        .tag-checkboxes { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
        .tag-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; color: var(--text-main); cursor: pointer; }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>

        <main>
            <div class="forum-container fade-up">

                <!-- VIEW 1: DANH SÁCH CHỦ ĐỀ -->
                <div id="thread-list-view">
                    <div class="forum-header">
                        <h1 class="forum-title">⧉ Diễn Đàn Toán Học</h1>
                        <button class="btn-primary" id="btn-show-create">+ Tạo chủ đề mới</button>
                    </div>

                    <div class="nav-filter-bar fade-up" id="forum-filter-bar">
                        <button class="nav-filter-btn active" data-tag="all">Tất Cả</button>
                        <button class="nav-filter-btn" data-tag="Số Học">Số Học</button>
                        <button class="nav-filter-btn" data-tag="Tổ Hợp">Tổ Hợp</button>
                        <button class="nav-filter-btn" data-tag="Hình Học">Hình Học</button>
                        <button class="nav-filter-btn" data-tag="Đại Số">Đại Số</button>
                        <button class="nav-filter-btn" data-tag="Giải Tích">Giải Tích</button>
                    </div>

                    <!-- Form tạo chủ đề -->
                    <div class="forum-form" id="create-thread-form-container">
                        <h3>✏️ Chủ đề mới</h3>
                        <div id="create-login-notice" class="login-notice" style="display:none;">
                            Bạn cần <a href="/SMP/pages/auth.html">đăng nhập</a> để tạo chủ đề thảo luận.
                        </div>
                        <form id="create-thread-form" style="display:none;">
                            <div class="form-group">
                                <label>Tiêu đề <span style="color:#e74c3c">*</span></label>
                                <input type="text" id="thread-title" class="form-control"
                                    placeholder="Ví dụ: Chứng minh bất đẳng thức Cauchy-Schwarz dạng tổng quát" required>
                            </div>
                            <div class="form-group">
                                <label>Gắn thẻ (Tags)</label>
                                <div class="tag-checkboxes">
                                    <label class="tag-checkbox-label"><input type="checkbox" value="Số Học" class="thread-tag-cb"> Số Học</label>
                                    <label class="tag-checkbox-label"><input type="checkbox" value="Tổ Hợp" class="thread-tag-cb"> Tổ Hợp</label>
                                    <label class="tag-checkbox-label"><input type="checkbox" value="Hình Học" class="thread-tag-cb"> Hình Học</label>
                                    <label class="tag-checkbox-label"><input type="checkbox" value="Đại Số" class="thread-tag-cb"> Đại Số</label>
                                    <label class="tag-checkbox-label"><input type="checkbox" value="Giải Tích" class="thread-tag-cb"> Giải Tích</label>
                                </div>
                                <input type="text" id="thread-custom-tags" class="form-control" placeholder="Các thẻ khác (cách nhau bằng dấu phẩy, vd: IMO, Phương trình hàm)">
                            </div>
                            <div class="form-group">
                                <label>Nội dung — hỗ trợ LaTeX <code style="background:rgba(92,225,230,0.1);padding:1px 6px;border-radius:3px;color:var(--accent-cyan)">$...$</code> và <code style="background:rgba(92,225,230,0.1);padding:1px 6px;border-radius:3px;color:var(--accent-cyan)">$$...$$</code></label>
                                <div class="latex-editor-wrap">
                                    <textarea id="create-content" class="latex-textarea"
                                        placeholder="Nhập nội dung bài viết. Gõ công thức bằng LaTeX: $x^2 + y^2 = z^2$ hoặc $$\int_0^1 x\,dx = \frac{1}{2}$$" required></textarea>
                                </div>
                                <button type="button" class="latex-preview-toggle" onclick="toggleForumPreview('create-content','create-preview')">▶ Xem preview LaTeX</button>
                                <div class="latex-preview-box" id="create-preview">
                                    <span style="opacity:0.4; font-style:italic; font-size:0.85rem;">Bắt đầu gõ rồi bấm preview...</span>
                                </div>
                            </div>
                            <div class="form-row-actions">
                                <button type="button" class="btn-secondary" id="btn-cancel-create">Hủy</button>
                                <button type="submit" class="btn-primary" id="btn-submit-create">📮 Đăng bài</button>
                            </div>
                        </form>
                    </div>

                    <div class="thread-list" id="thread-list-container">
                        <div style="text-align:center; color:var(--text-muted); padding:40px;">Đang tải danh sách chủ đề...</div>
                    </div>
                </div>

                <!-- VIEW 2: CHI TIẾT CHỦ ĐỀ -->
                <div id="thread-detail-view">
                    <button class="btn-back" id="btn-back-to-list">&larr; Quay lại danh sách</button>
                    <div id="thread-main-content"></div>

                    <!-- Edit thread form (ẩn mặc định) -->
                    <div class="forum-form" id="edit-thread-form-container">
                        <h3>✏️ Chỉnh sửa chủ đề</h3>
                        <form id="edit-thread-form">
                            <div class="form-group">
                                <label>Tiêu đề</label>
                                <input type="text" id="edit-thread-title" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label>Nội dung</label>
                                <div class="latex-editor-wrap">
                                    <textarea id="edit-thread-content" class="latex-textarea" required></textarea>
                                </div>
                                <button type="button" class="latex-preview-toggle" onclick="toggleForumPreview('edit-thread-content','edit-thread-preview')">▶ Xem preview LaTeX</button>
                                <div class="latex-preview-box" id="edit-thread-preview"></div>
                            </div>
                            <div class="form-row-actions">
                                <button type="button" class="btn-secondary" onclick="document.getElementById('edit-thread-form-container').style.display='none'">Hủy</button>
                                <button type="submit" class="btn-primary">💾 Lưu thay đổi</button>
                            </div>
                        </form>
                    </div>

                    <h3 style="font-family:'Playfair Display',serif; margin:36px 0 16px; border-bottom:1px solid var(--border-light); padding-bottom:10px;">Bình luận</h3>
                    <div id="thread-replies-list" style="margin-bottom:28px;"></div>

                    <!-- Form viết bình luận -->
                    <div class="forum-form" id="reply-form-container" style="display:block;">
                        <h4 style="margin-bottom:14px; font-family:'JetBrains Mono',monospace; font-size:0.9rem; color:var(--text-muted);">VIẾT BÌNH LUẬN</h4>
                        <div id="reply-auth-notice" class="login-notice" style="display:none;">
                            Bạn cần <a href="/SMP/pages/auth.html">đăng nhập</a> để bình luận.
                        </div>
                        <form id="create-reply-form" style="display:none;">
                            <div class="form-group">
                                <div class="latex-editor-wrap">
                                    <textarea id="reply-content" class="latex-textarea" placeholder="Viết bình luận... Hỗ trợ LaTeX: $x^2$, $$\frac{a}{b}$$" required></textarea>
                                </div>
                                <button type="button" class="latex-preview-toggle" onclick="toggleForumPreview('reply-content','reply-preview')">▶ Xem preview LaTeX</button>
                                <div class="latex-preview-box" id="reply-preview"></div>
                            </div>
                            <div class="form-row-actions">
                                <button type="submit" class="btn-primary" id="btn-submit-reply">💬 Gửi bình luận</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Edit reply modal -->
    <div class="history-modal-overlay" id="edit-reply-modal">
        <div class="history-modal">
            <h3 style="margin-bottom:16px; font-family:'Playfair Display',serif;">✏️ Sửa bình luận</h3>
            <div class="latex-editor-wrap">
                <textarea id="edit-reply-content" class="latex-textarea" style="min-height:100px;"></textarea>
            </div>
            <div class="form-row-actions" style="margin-top:16px;">
                <button class="btn-secondary" onclick="document.getElementById('edit-reply-modal').classList.remove('show')">Hủy</button>
                <button class="btn-primary" id="btn-save-reply-edit">💾 Lưu</button>
            </div>
        </div>
    </div>

    <!-- Edit history modal -->
    <div class="history-modal-overlay" id="history-modal">
        <div class="history-modal">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 style="font-family:'Playfair Display',serif;">📜 Lịch sử chỉnh sửa</h3>
                <button class="btn-secondary" onclick="document.getElementById('history-modal').classList.remove('show')">✕ Đóng</button>
            </div>
            <div id="history-list"></div>
        </div>
    </div>

    <script src="/SMP/core/js/layout.js?v=7"></script>
    <script src="/SMP/core/js/shared.js?v=7"></script>
    <script src="/SMP/core/js/saved.js?v=7"></script>
    <script src="/SMP/core/js/forum.js?v=7"></script>
</body>
</html>
