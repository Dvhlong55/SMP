<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diễn Đàn Toán Học - SMP</title>
    <!-- CSS dùng chung -->
    <link rel="stylesheet" href="/SMP/core/css/shared.css">
    <!-- MathJax -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        .forum-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 24px;
        }
        .forum-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 20px;
        }
        .forum-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-gold);
        }
        .btn-primary {
            background: var(--accent-cyan);
            color: #111;
            padding: 10px 24px;
            border-radius: 6px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            background: var(--accent-gold);
        }

        /* Danh sách chủ đề */
        .thread-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .thread-item {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .thread-item:hover {
            border-color: var(--accent-cyan);
        }
        .thread-item-title {
            font-size: 1.3rem;
            font-family: 'Playfair Display', serif;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        .thread-item-meta {
            display: flex;
            gap: 16px;
            font-size: 0.85rem;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        /* Chi tiết chủ đề */
        #thread-detail-view {
            display: none;
        }
        .btn-back {
            background: none;
            border: none;
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            cursor: pointer;
            font-size: 1rem;
            margin-bottom: 20px;
            padding: 0;
            display: inline-block;
        }
        .btn-back:hover {
            color: var(--accent-gold);
            text-decoration: underline;
        }
        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 24px;
        }
        .post-meta {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            border-bottom: 1px dashed var(--border-light);
            padding-bottom: 12px;
        }
        .post-author {
            color: var(--accent-gold);
            font-weight: bold;
        }
        .post-date {
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        .post-content {
            line-height: 1.6;
            color: var(--text-dark);
            white-space: pre-line;
        }

        /* Form tạo mới */
        .forum-form {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
            display: none; /* Ẩn mặc định */
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-dark);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            border-radius: 6px;
            color: var(--text-dark);
            font-family: inherit;
        }
        body:not(.dark-mode) .form-control {
            background: rgba(0, 0, 0, 0.02);
        }
        .form-control:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }
        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>
        
        <main>
            <div class="forum-container fade-up">
                
                <!-- VIEW 1: DANH SÁCH CHỦ ĐỀ -->
                <div id="thread-list-view">
                    <div class="forum-header">
                        <h1 class="forum-title">Diễn Đàn Toán Học</h1>
                        <button class="btn-primary" id="btn-show-create">Tạo chủ đề mới</button>
                    </div>

                    <!-- Form tạo chủ đề (Ẩn mặc định) -->
                    <div class="forum-form" id="create-thread-form-container">
                        <h3 style="margin-bottom: 16px; font-family: 'Playfair Display', serif;">Chủ đề mới</h3>
                        <form id="create-thread-form">
                            <div class="form-group">
                                <input type="text" id="thread-title" class="form-control" placeholder="Nhập tiêu đề (VD: Cho mình hỏi bài toán hình học 12...)" required>
                            </div>
                            <div class="form-group">
                                <textarea id="thread-content" class="form-control" placeholder="Nhập nội dung. Hỗ trợ gõ công thức Toán học bằng LaTeX, ví dụ: $x^2 + y^2 = r^2$ hoặc $$\int_{0}^{1} x dx$$" required></textarea>
                            </div>
                            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                                <button type="button" class="btn-primary" style="background: transparent; color: var(--text-muted); border: 1px solid var(--border-light);" id="btn-cancel-create">Hủy</button>
                                <button type="submit" class="btn-primary" id="btn-submit-create">Đăng bài</button>
                            </div>
                        </form>
                    </div>

                    <div class="thread-list" id="thread-list-container">
                        <div style="text-align: center; color: var(--text-muted); padding: 40px;">Đang tải danh sách chủ đề...</div>
                    </div>
                </div>

                <!-- VIEW 2: CHI TIẾT CHỦ ĐỀ -->
                <div id="thread-detail-view">
                    <button class="btn-back" id="btn-back-to-list">&larr; Quay lại danh sách</button>
                    
                    <div id="thread-main-content">
                        <!-- Sẽ được render bằng JS -->
                    </div>

                    <h3 style="font-family: 'Playfair Display', serif; margin: 40px 0 20px; border-bottom: 1px solid var(--border-light); padding-bottom: 10px;">Bình luận</h3>
                    
                    <div id="thread-replies-list" style="margin-bottom: 30px;">
                        <!-- Các phản hồi render ở đây -->
                    </div>

                    <!-- Form phản hồi -->
                    <div class="forum-form" id="reply-form-container" style="display: block;">
                        <h4 style="margin-bottom: 16px;">Viết bình luận</h4>
                        <div id="reply-auth-alert" style="display: none; padding: 16px; background: rgba(255,255,255,0.05); text-align: center; border-radius: 6px; margin-bottom: 16px;">
                            Bạn cần <a href="/SMP/pages/auth.html" style="color: var(--accent-cyan);">đăng nhập</a> để bình luận.
                        </div>
                        <form id="create-reply-form" style="display: none;">
                            <div class="form-group">
                                <textarea id="reply-content" class="form-control" placeholder="Viết phản hồi... Hỗ trợ gõ LaTeX" required></textarea>
                            </div>
                            <div style="text-align: right;">
                                <button type="submit" class="btn-primary" id="btn-submit-reply">Gửi bình luận</button>
                            </div>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/SMP/core/js/layout.js"></script>
    <script src="/SMP/core/js/shared.js"></script>
    <script src="/SMP/core/js/forum.js"></script>
</body>
</html>
