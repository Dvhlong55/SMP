<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMP">
    <link rel="apple-touch-icon" href="/core/image/favicon-192.png">
    <title>Bài viết đã lưu - SMP</title>
    <!-- Giao diện dùng chung -->
    <link rel="stylesheet" href="/core/css/shared.css">
    <style>
        .saved-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 24px;
        }
        .saved-header {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 40px;
            text-align: center;
        }
        
        .saved-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        
        .saved-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
        }
        
        .saved-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }
        
        .saved-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 16px;
            line-height: 1.4;
            text-decoration: none;
        }
        .saved-title:hover {
            color: var(--accent-cyan);
        }
        
        .saved-actions {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .unsave-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .unsave-btn:hover {
            background: rgba(231, 76, 60, 0.1);
        }

        /* Loading / Error states */
        .state-container {
            text-align: center;
            padding: 60px 20px;
        }
        .state-icon {
            font-size: 4rem;
            color: var(--accent-cyan);
            margin-bottom: 20px;
        }
        .state-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 16px;
        }
        .state-desc {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .state-btn {
            display: inline-block;
            background: var(--accent-cyan);
            color: #111;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            transition: transform 0.3s, background 0.3s;
        }
        .state-btn:hover {
            transform: translateY(-2px);
            background: var(--accent-gold);
            transition: all 0.2s;
        }
        .notif-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }
        .notif-btn.delete:hover {
            border-color: var(--accent-red);
            color: var(--accent-red);
        }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>

        <main>
            <div class="hero-header fade-up">
                <h1>Tất Cả Thông Báo</h1>
                <p class="quote">"Cập nhật những tương tác mới nhất của bạn."</p>
                <button onclick="notifCtrl.markAllRead()" class="notif-header-btn">Đánh dấu tất cả đã đọc</button>
            </div>

            <div id="notif-container" style="max-width: 800px; margin: 0 auto;">
                <div style="text-align:center; padding:40px; color:var(--text-muted);">Đang tải thông báo...</div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/core/js/layout.js"></script>
    <script src="/core/js/shared.js"></script>
    <script src="/core/js/saved.js"></script>
</body>
</html>
