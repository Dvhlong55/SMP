<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SMP">
    <link rel="apple-touch-icon" href="/core/image/favicon-192.png">
    <title>Bài viết đã lưu - SMP</title>
    <!-- Giao diện dùng chung -->
    <link rel="stylesheet" href="/core/css/shared.css?v=33">
    <style>
        .saved-container {
            max-width: 900px;
            margin: 60px auto;
            padding: 0 24px;
        }
        .saved-header {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--accent-gold);
            margin-bottom: 40px;
            text-align: center;
        }
        
        .saved-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        
        .saved-card {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s, border-color 0.3s;
            position: relative;
        }
        
        .saved-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-cyan);
        }
        
        .saved-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.2rem;
            color: var(--text-dark);
            margin-bottom: 16px;
            line-height: 1.4;
            text-decoration: none;
        }
        .saved-title:hover {
            color: var(--accent-cyan);
        }
        
        .saved-actions {
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .unsave-btn {
            background: none;
            border: none;
            color: #e74c3c;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .unsave-btn:hover {
            background: rgba(231, 76, 60, 0.1);
        }

        /* Loading / Error states */
        .state-container {
            text-align: center;
            padding: 60px 20px;
        }
        .state-icon {
            font-size: 4rem;
            color: var(--accent-cyan);
            margin-bottom: 20px;
        }
        .state-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--text-dark);
            margin-bottom: 16px;
        }
        .state-desc {
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.6;
        }
        .state-btn {
            display: inline-block;
            background: var(--accent-cyan);
            color: #111;
            padding: 12px 32px;
            border-radius: 6px;
            text-decoration: none;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            transition: transform 0.3s, background 0.3s;
        }
        .state-btn:hover {
            transform: translateY(-2px);
            background: var(--accent-gold);
        }
        
        #saved-content, #auth-required {
            display: none;
        }
    </style>
    <!-- SMP SEO START -->
    <meta name="description" content="Nơi lưu trữ các bài viết toán học hay, đề thi tâm đắc để bạn tiện ôn tập lại trước kỳ thi.">
    <meta property="og:title" content="SMP — Bài Viết Đã Lưu">
    <meta property="og:description" content="Nơi lưu trữ các bài viết toán học hay, đề thi tâm đắc để bạn tiện ôn tập lại trước kỳ thi.">
    <meta property="og:image" content="https://smp-math.com/core/image/image_49b1a4.png">
    <meta property="og:url" content="https://smp-math.com/pages/saved.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Secrets of Mathematical Principles">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SMP — Bài Viết Đã Lưu">
    <meta name="twitter:description" content="Nơi lưu trữ các bài viết toán học hay, đề thi tâm đắc để bạn tiện ôn tập lại trước kỳ thi.">
    <meta name="twitter:image" content="https://smp-math.com/core/image/image_49b1a4.png">
    <!-- SMP SEO END -->
</head>
<body>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>
        <div id="sidebar-placeholder"></div>
        
        <main>
            <!-- Trạng thái chưa đăng nhập -->
            <div id="auth-required" class="state-container fade-up">
                <div class="state-icon">&#x26A0;</div>
                <h2 class="state-title">Vui lòng đăng nhập</h2>
                <p class="state-desc">Bạn cần phải đăng nhập để có thể xem và quản lý danh sách các bài viết đã lưu.</p>
                <a href="#" onclick="if(window.openAuthModal) window.openAuthModal('login'); return false;" class="state-btn">Đăng nhập ngay</a>
            </div>
            
            <!-- Danh sách bài lưu -->
            <div id="saved-content" class="saved-container fade-up">
                <h1 class="saved-header">Bài viết đã lưu</h1>
                <div id="saved-list" class="saved-list">
                    <!-- Cards will be injected here -->
                    <div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">Đang tải dữ liệu...</div>
                </div>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="/core/js/layout.js?v=33"></script>
    <script src="/core/js/shared.js?v=33"></script>
    <script src="/core/js/saved.js?v=33"></script>
</body>
</html>
