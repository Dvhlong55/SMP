<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Của Tôi — SMP</title>
    
    <!-- Meta tags để tương thích với layout.js -->
    <meta name="category-name" content="HỒ SƠ">
    <meta name="category-url" content="/pages/profile.html">

    <!-- CSS -->
    <link rel="stylesheet" href="/core/css/shared.css">
    <link rel="stylesheet" href="/core/css/post.css">
    <style>
        .profile-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
        }
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 20px;
        }
        .profile-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            color: var(--text-main);
            margin: 0;
        }
        .logout-btn {
            background-color: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background-color: #ef4444;
            color: white;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 20px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: normal;
        }
        .stat-card .value {
            font-size: 2rem;
            color: var(--accent-gold);
            font-weight: bold;
        }
        
        /* Cài đặt chung */
        .settings-section {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .settings-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.5rem;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-muted);
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-light);
            border-radius: 4px;
            color: var(--text-main);
        }
        .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
        }
        .btn-primary {
            background-color: var(--accent-gold);
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-primary:disabled {
            background-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        .msg {
            margin-top: 10px;
            font-size: 0.9rem;
            display: none;
        }
        .msg.error { color: #ef4444; }
        .msg.success { color: #10b981; }
        
        /* Heatmap Styles */
        .heatmap-container {
            overflow-x: auto;
            padding-bottom: 10px;
        }
        .heatmap {
            display: grid;
            grid-template-rows: repeat(7, 12px);
            grid-auto-flow: column;
            gap: 3px;
        }
        .heatmap-cell {
            width: 12px;
            height: 12px;
            border-radius: 2px;
            background-color: var(--heatmap-0, #333); /* Sẽ update theo theme */
            position: relative;
        }
        .heatmap-cell:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            white-space: nowrap;
            z-index: 10;
            margin-bottom: 5px;
            pointer-events: none;
        }
        
        body.dark-mode {
            --heatmap-0: #1a1a1a;
            --heatmap-1: #0e4429;
            --heatmap-2: #006d32;
            --heatmap-3: #26a641;
            --heatmap-4: #39d353;
        }
        
        body:not(.dark-mode) {
            --heatmap-0: #ebedf0;
            --heatmap-1: #9be9a8;
            --heatmap-2: #40c463;
            --heatmap-3: #30a14e;
            --heatmap-4: #216e39;
        }
        
        .heatmap-cell[data-level="0"] { background-color: var(--heatmap-0); }
        .heatmap-cell[data-level="1"] { background-color: var(--heatmap-1); }
        .heatmap-cell[data-level="2"] { background-color: var(--heatmap-2); }
        .heatmap-cell[data-level="3"] { background-color: var(--heatmap-3); }
        .heatmap-cell[data-level="4"] { background-color: var(--heatmap-4); }
    </style>
</head>
<body class="dark-mode">

    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>

        <div class="profile-container fade-up">
            <div class="profile-header">
                <h1>Chào, <span id="profile-username">...</span>!</h1>
                <button class="logout-btn" onclick="window.handleLogout()">Đăng Xuất</button>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Tổng Điểm (Points)</h3>
                    <div class="value" id="stat-points">0</div>
                </div>
                <div class="stat-card">
                    <h3>Chuỗi Ngày (Streak)</h3>
                    <div class="value" id="stat-streak">0</div>
                </div>
            </div>

            <div class="settings-section">
                <h2>Hoạt Động Giải Bài (Heatmap)</h2>
                <div class="heatmap-container">
                    <div class="heatmap" id="activity-heatmap">
                        <!-- JS sẽ render các ô vuông vào đây -->
                    </div>
                </div>
            </div>

            <div class="settings-section">
                <h2>Cài Đặt Giao Diện</h2>
                <div class="form-group">
                    <label>Chế độ Sáng / Tối</label>
                    <select id="theme-select" onchange="updateThemePreference(this.value)">
                        <option value="dark">Tối (Dark Mode)</option>
                        <option value="light">Sáng (Light Mode)</option>
                    </select>
                </div>
            </div>

            <div class="settings-section">
                <h2>Cài Đặt Tài Khoản</h2>
                
                <div style="margin-bottom: 30px;">
                    <h3>Đổi Tên Người Dùng</h3>
                    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 10px;">
                        Lưu ý: Bạn chỉ có thể đổi tên 90 ngày một lần.
                    </p>
                    <form id="form-username" onsubmit="handleUpdateUsername(event)">
                        <div class="form-group">
                            <input type="text" id="new-username" placeholder="Tên người dùng mới" required minlength="3">
                        </div>
                        <button type="submit" class="btn-primary" id="btn-username">Cập Nhật Tên</button>
                        <div id="msg-username" class="msg"></div>
                    </form>
                </div>
                
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px;">
                
                <div>
                    <h3>Đổi Mật Khẩu</h3>
                    <form id="form-password" onsubmit="handleUpdatePassword(event)">
                        <div class="form-group">
                            <input type="password" id="old-password" placeholder="Mật khẩu cũ" required>
                        </div>
                        <div class="form-group">
                            <input type="password" id="new-password" placeholder="Mật khẩu mới" required minlength="6">
                        </div>
                        <button type="submit" class="btn-primary" id="btn-password">Đổi Mật Khẩu</button>
                        <div id="msg-password" class="msg"></div>
                    </form>
                </div>
            </div>
            
        </div>
    </div>

    <!-- Layout scripts -->
    <script src="/core/js/sidebar-data.js"></script>
    <script src="/core/js/layout.js?v=4"></script>
    <script src="/core/js/shared.js?v=4"></script>
    <!-- Profile script -->
    <script src="/core/js/profile.js"></script>
    
</body>
</html>
