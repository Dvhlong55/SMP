<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Lớp — SMP</title>
    
    <meta name="category-name" content="CLASS">
    <meta name="category-url" content="/pages/class.html">
    <link rel="icon" type="image/png" href="/core/image/favicon.png">

    <!-- CSS -->
    <link rel="stylesheet" href="/core/css/shared.css?v=36">
    
    <style>
        .class-container {
            width: 100%;
            max-width: 1400px;
            margin: 40px auto;
            padding: 20px;
            box-sizing: border-box;
        }
        
        .class-admin-layout {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }
        
        .class-sidebar-container {
            width: 320px;
            flex-shrink: 0;
        }
        
        .class-main-container {
            flex-grow: 1;
            min-width: 0; /* Cho phép table thu nhỏ */
        }
        
        .settings-section {
            background: var(--card-bg);
            border: 1px solid var(--border-light);
            border-radius: 8px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: var(--shadow-soft);
        }
        
        .settings-section h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.4rem;
            color: var(--text-dark);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 10px;
        }
        
        @media (max-width: 1100px) {
            .class-admin-layout {
                flex-direction: column;
            }
            .class-sidebar-container {
                width: 100%;
            }
        }
        
        /* Modal form styles */
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.85rem; }
        .form-group input { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dark); font-family: inherit; font-size: 0.9rem; transition: all 0.3s; box-sizing: border-box; }
        body:not(.dark-mode) .form-group input { background: rgba(0, 0, 0, 0.02); }
        .form-group input:focus { outline: none; border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.08); }
        
        .tx-input { width: 100%; padding: 8px 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light); border-radius: 6px; color: var(--text-dark); font-family: inherit; font-size: 0.85rem; transition: all 0.3s; box-sizing: border-box; }
        body:not(.dark-mode) .tx-input { background: rgba(0, 0, 0, 0.02); }
        .tx-input:focus { outline: none; border-color: var(--accent-cyan); }
        
        /* Table styles */
        .admin-users-table { width: 100%; border-collapse: collapse; }
        .admin-users-table th, .admin-users-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.95rem; color: var(--text-muted); }
        .admin-users-table th { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-dark); border-bottom: 2px solid var(--border-light); }
        .admin-users-table tbody tr:hover { background: rgba(255,255,255,0.02); }
        
        /* Transaction History Table */
        .transaction-table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .transaction-table th, .transaction-table td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border-light); font-size: 0.85rem; color: var(--text-muted); }
        .transaction-table th { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; text-transform: uppercase; color: var(--text-dark); }
        
        .text-green { color: #10b981; } /* Trả */
        .text-red { color: #ef4444; }   /* Nợ */
        
        .btn-primary { background: var(--accent-cyan, #5ce1e6); color: #111; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: inherit; transition: opacity 0.2s; font-size: 0.9rem; }
        .btn-primary:hover { opacity: 0.9; }
        .btn-danger { background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: inherit; transition: opacity 0.2s; font-size: 0.9rem; }
        .btn-danger:hover { opacity: 0.9; }
        .btn-secondary { background: transparent; color: var(--text-dark); border: 1px solid var(--border-light); padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; font-family: inherit; transition: all 0.2s; font-size: 0.9rem; }
        .btn-secondary:hover { background: rgba(255,255,255,0.05); }
    </style>
</head>
<body>
    <div id="sidebar-placeholder"></div>

    <div class="main-wrapper">
        <div id="topbar-placeholder"></div>

        <main>
            <div class="class-container">
                <div class="hero-header fade-up" style="margin-bottom: 30px;">
                    <h1>Hệ Thống Quản Lý Lớp Học</h1>
                </div>

                <div id="class-admin-section">
                    <div class="class-admin-layout">
                        <!-- Cột trái: Danh sách lớp -->
                        <div class="class-sidebar-container">
                            <div class="settings-section" style="padding: 20px;">
                                <h2 style="font-size: 1.1rem; margin-bottom: 15px;">Danh Sách Lớp</h2>
                                <div id="class-list-container" style="display: flex; flex-direction: column; gap: 10px;">
                                    <!-- Class list renders here -->
                                </div>
                                <button class="btn-primary" style="margin-top: 15px; width: 100%; padding: 8px; font-size: 0.85rem;" onclick="promptCreateClass()">+ Lớp Mới</button>
                            </div>
                        </div>
                        
                        <!-- Cột phải: Danh sách học viên rút gọn -->
                        <div class="class-main-container">
                            <div class="settings-section" style="width: 100%; box-sizing: border-box;">
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                                    <h2 style="margin: 0; border: none; padding: 0;" id="class-title-display">Chọn một lớp học</h2>
                                    <button class="btn-primary" style="padding: 8px 16px; font-size: 0.85rem;" onclick="addNewStudentRow()">+ Học Viên</button>
                                </div>
                                
                                <div style="overflow-x: auto;">
                                    <table class="admin-users-table" id="class-table" style="min-width: 100%;">
                                        <thead>
                                            <tr>
                                                <th style="width: 50px;">STT</th>
                                                <th>Họ và Tên</th>
                                                <th style="width: 150px; text-align: right;">Tổng Nợ</th>
                                            </tr>
                                        </thead>
                                        <tbody id="class-tbody">
                                            <!-- Rendered dynamically -->
                                            <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Vui lòng chọn lớp</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        
        <!-- Modal Form Chi Tiết Học Viên (Có tính tiền theo toán học) -->
        <div id="student-detail-modal" onclick="if(event.target === this) closeStudentModal()" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.75); z-index: 9999; opacity: 0; transition: opacity 0.3s; padding: 20px; box-sizing: border-box; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);">
            <div style="background: var(--card-bg); border: 1px solid var(--border-light); border-radius: 12px; width: 100%; max-width: 800px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); max-height: 90vh; overflow-y: auto;">
                <h2 style="margin-top: 0; margin-bottom: 25px; border-bottom: 1px solid var(--border-light); padding-bottom: 15px; font-size: 1.5rem;">Sơ Yếu Lý Lịch Học Viên</h2>
                
                <form id="student-detail-form" onsubmit="saveStudentFromModal(event)">
                    <input type="hidden" id="modal-student-id">
                    
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px;">
                        <!-- Cột thông tin cá nhân -->
                        <div>
                            <h3 style="color: var(--accent-cyan); margin-bottom: 15px; font-size: 1.1rem; border-bottom: 1px solid rgba(92,225,230,0.2); padding-bottom: 5px;">Thông tin cá nhân</h3>
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label>Họ và Tên</label>
                                <input type="text" id="modal-full-name" required>
                            </div>
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label>Năm sinh</label>
                                <input type="number" id="modal-birth-year">
                            </div>
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label>Số điện thoại Zalo</label>
                                <input type="text" id="modal-phone">
                            </div>
                            <div class="form-group" style="margin-bottom: 15px;">
                                <label>Email</label>
                                <input type="email" id="modal-email">
                            </div>
                        </div>
                        
                        <!-- Cột tính tiền và lịch sử -->
                        <div>
                            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 15px; border-bottom: 1px solid rgba(201,169,110,0.2); padding-bottom: 5px;">
                                <h3 style="color: var(--accent-gold); margin: 0; font-size: 1.1rem;">Sổ Cái Giao Dịch</h3>
                                <div style="font-size: 0.9rem; color: var(--text-muted);">
                                    Tổng Nợ: <span id="modal-total-debt" style="font-weight: bold; color: var(--accent-gold); font-size: 1.2rem;">0k</span>
                                </div>
                            </div>
                            
                            <!-- Thêm giao dịch -->
                            <div style="background: rgba(255,255,255,0.03); padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--border-light);">
                                <h4 style="margin: 0 0 10px 0; font-size: 0.9rem; color: var(--text-dark);">Thêm Giao Dịch Mới</h4>
                                <div style="display: grid; grid-template-columns: 100px 1fr; gap: 10px; margin-bottom: 10px;">
                                    <div>
                                        <label style="font-size: 0.75rem; color: var(--text-muted);">Số tiền (k)</label>
                                        <input type="number" id="tx-amount" placeholder="+/-" class="tx-input">
                                    </div>
                                    <div>
                                        <label style="font-size: 0.75rem; color: var(--text-muted);">Ngày</label>
                                        <input type="date" id="tx-date" class="tx-input">
                                    </div>
                                </div>
                                <div style="margin-bottom: 10px;">
                                    <label style="font-size: 0.75rem; color: var(--text-muted);">Ghi chú</label>
                                    <input type="text" id="tx-note" placeholder="Ví dụ: Đóng học phí..." class="tx-input">
                                </div>
                                <button type="button" class="btn-primary" style="width: 100%; padding: 8px;" onclick="addTransaction()">Thêm Giao Dịch</button>
                            </div>
                            
                            <!-- Bảng Lịch sử -->
                            <div style="max-height: 180px; overflow-y: auto; border: 1px solid var(--border-light); border-radius: 6px;">
                                <table class="transaction-table" id="transaction-history-table">
                                    <thead>
                                        <tr>
                                            <th>Ngày</th>
                                            <th>Ghi Chú</th>
                                            <th style="text-align: right;">Tiền</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transaction-tbody">
                                        <!-- Transactions will be populated here -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 30px; border-top: 1px solid var(--border-light); padding-top: 20px;">
                        <button type="button" class="btn-danger" onclick="deleteStudentFromClass()">Xóa Học Viên</button>
                        <div style="display: flex; gap: 10px;">
                            <button type="button" class="btn-secondary" onclick="closeStudentModal()">Hủy</button>
                            <button type="submit" class="btn-primary">Lưu Thay Đổi</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        
    </div>

    <script src="/core/js/shared.js"></script>
    <script src="/core/js/layout.js?v=36"></script>
    <script src="/core/js/class.js"></script>
</body>
</html>
